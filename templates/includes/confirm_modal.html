<div class="modal fade" id="confirmActionModal" tabindex="-1"
     aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg border-0" style="border-radius:12px;">

      <div class="modal-header border-0 pb-0" style="padding:20px 24px 8px;">
        <h5 class="modal-title fw-bold" id="confirmModalLabel" style="font-size:1.05rem;color:#011B33;"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>

      <div class="modal-body py-3" id="confirmModalBody" style="padding:10px 24px 18px;font-size:0.9rem;color:#475569;line-height:1.55;"></div>

      <div class="modal-footer border-0 pt-0 gap-2" style="padding:10px 24px 20px;">
        <button type="button"
                class="btn btn-outline-secondary btn-sm px-4"
                style="border-radius:7px;"
                data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-sm px-4 d-flex align-items-center gap-2"
                style="border-radius:7px;"
                id="confirmModalBtn">
          <span class="confirm-btn-label"></span>
          <!-- Spinner — hidden until submit is clicked -->
          <span class="spinner-border spinner-border-sm d-none"
                id="confirmModalSpinner" role="status" aria-hidden="true"></span>
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Single hidden form — action and hidden fields are set dynamically -->
<form id="confirmActionForm" method="post" style="display:none;">
  {% csrf_token %}
  <div id="confirmActionHiddenFields"></div>
</form>
